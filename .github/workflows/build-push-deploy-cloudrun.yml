name: Build Push Deploy Cloud Run

# Build Quarkus Native image → Artifact Registry → deploy Cloud Run service.
# Requires repo Variables + Secrets (see CLOUDRUN-001-manual-finish.md).
# JVM snapshot preserved on branch dev-quarkus-jvm-cr.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CLOUD_RUN_SERVICE: cr-react-cms-content
  IMAGE_NAME: react-cms-content-service
  HEALTH_PATH: /api/content/health

jobs:
  build-push-deploy:
    name: Build Native image and deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve GCP settings
        id: gcp
        run: |
          PROJECT_ID="${{ vars.GCP_PROJECT_ID }}"
          REGION="${{ vars.GCP_REGION }}"
          AR_REPO="${{ vars.AR_REPOSITORY }}"
          RUN_SA="${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}"
          if [ -z "$PROJECT_ID" ] || [ -z "$REGION" ] || [ -z "$AR_REPO" ] || [ -z "$RUN_SA" ]; then
            echo "Set repository Variables: GCP_PROJECT_ID, GCP_REGION, AR_REPOSITORY, GCP_CLOUD_RUN_SERVICE_ACCOUNT" >&2
            exit 1
          fi
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${{ env.IMAGE_NAME }}"
          echo "project_id=${PROJECT_ID}" >> "$GITHUB_OUTPUT"
          echo "region=${REGION}" >> "$GITHUB_OUTPUT"
          echo "ar_repo=${AR_REPO}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "run_sa=${RUN_SA}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build Quarkus Native executable (Mandrel container)
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests -DskipITs package -Dnative \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.native-image-xmx=5g

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ steps.gcp.outputs.region }}-docker.pkg.dev" --quiet

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.gcp.outputs.image_uri }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Native container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.native
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_REPO=https://github.com/${{ github.repository }}
            GIT_SHA=${{ github.sha }}

      - name: Resolve app env
        id: app_env
        run: |
          AUTH_SERVICE_URL="${{ vars.AUTH_SERVICE_URL }}"
          if [ -z "$AUTH_SERVICE_URL" ]; then
            echo "Set repository Variable AUTH_SERVICE_URL to the auth Cloud Run base URL" >&2
            exit 1
          fi
          echo "auth_service_url=${AUTH_SERVICE_URL}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ steps.gcp.outputs.region }}
          project_id: ${{ steps.gcp.outputs.project_id }}
          image: ${{ steps.gcp.outputs.image_uri }}:${{ github.sha }}
          env_vars: |
            AUTH_SERVICE_URL=${{ steps.app_env.outputs.auth_service_url }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --memory=256Mi
            --cpu=1
            --cpu-boost
            --min-instances=0
            --max-instances=3
            --timeout=300
            --service-account=${{ steps.gcp.outputs.run_sa }}
            --startup-probe=httpGet.path=${{ env.HEALTH_PATH }},httpGet.port=8080,initialDelaySeconds=0,periodSeconds=2,failureThreshold=60,timeoutSeconds=1
            --liveness-probe=httpGet.path=${{ env.HEALTH_PATH }},httpGet.port=8080,periodSeconds=30,timeoutSeconds=3
