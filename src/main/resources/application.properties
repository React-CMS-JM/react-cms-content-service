quarkus.application.name=react-cms-content-service
# Cloud Run injects PORT; local runs use HTTP_PORT from .env (default 8082)
quarkus.http.port=${PORT:${HTTP_PORT:8082}}

# Datasource
# TLS is verified against the JVM truststore (cacerts), which already contains
# the ISRG Root X1 CA used by TiDB Cloud — no PEM file needs to be mounted.
# Local: DB_SSL_MODE=PREFERRED (plain MySQL). Production (TiDB): DB_SSL_MODE=VERIFY_IDENTITY.
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USER:}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:react_cms}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Hibernate (schema owned by SQL scripts)
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false

# Jackson camelCase (default) — explicit for clarity
quarkus.jackson.property-naming-strategy=LOWER_CAMEL_CASE
quarkus.jackson.write-dates-as-timestamps=false

# CORS (comma-separated; production adds the frontend origin via CORS_ORIGINS)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

# JWT HS256 — verify with JWK derived from the same JWT_SECRET as auth-service.
# Local: scripts/generate-jwt-jwk.ps1. Container: entrypoint materializes JWK from JWT_SECRET.
# JWT_ISSUER must match the auth-service issuer.
mp.jwt.verify.issuer=${JWT_ISSUER:https://react-cms.local/auth}
smallrye.jwt.verify.algorithm=HS256
smallrye.jwt.verify.key.location=${JWT_JWK_PATH:jwt-secret.jwk}

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=React CMS Content Service
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Auth: public GETs; mutating requires authentication. JWT optional on public reads.
quarkus.http.auth.proactive=false

quarkus.http.auth.permission.public-docs.paths=/q/*
quarkus.http.auth.permission.public-docs.policy=permit

quarkus.http.auth.permission.public-get.paths=/api/content/health,/api/posts,/api/posts/*,/api/content-types,/api/categories,/api/categories/*,/api/tags,/api/tags/*,/api/comments,/api/comments/*,/api/settings,/api/settings/*,/api/ui-strings,/api/ui-strings/*
quarkus.http.auth.permission.public-get.methods=GET
quarkus.http.auth.permission.public-get.policy=permit

quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated
